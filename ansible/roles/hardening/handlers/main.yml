# Handlers for the HAVEN hardening role.

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Restart sshd
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: Restart auditd
  ansible.builtin.systemd:
    name: auditd
    state: restarted
